<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VEXO Coin · ورود و ثبت‌نام</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/login.css"></head><body><main class="auth-shell"><section class="auth-card"><a class="brand" href="index.html">V<b>EXO</b></a><div class="eyebrow">PLAYER ACCESS</div><h1>Welcome to <span class="grad">VEXO Coin.</span></h1><p class="muted">ابتدا وارد حساب شوید یا حساب کاربری جدید VEXO بسازید.</p><form id="loginForm"><label class="field">نوع حساب<select id="mode"><option value="signin">Sign in</option><option value="signup">Create account</option></select></label><label class="field">نام کاربری<input id="username" maxlength="24" placeholder="نام نمایشی شما"></label><label class="field">ایمیل<input id="email" type="email" required autocomplete="email"></label><label class="field">رمز عبور<input id="password" type="password" minlength="8" required autocomplete="current-password"></label><label class="field">تکرار رمز عبور<input id="confirm" type="password" minlength="8"></label><div class="auth-actions"><button class="btn primary" type="submit">ادامه امن ←</button><button class="btn" type="button" id="google">ورود با گوگل</button></div></form><p id="message" class="notice" aria-live="polite"></p><p class="muted">ورود و ثبت‌نام با Firebase Authentication انجام می‌شود. رمز عبور و عبارت بازیابی کیف پول را با کسی به اشتراک نگذارید.</p></section></main><script type="module" src="js/auth.js"></script></body></html>
